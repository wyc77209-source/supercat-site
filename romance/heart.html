<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CYBER HEART</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💗</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:16px;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);color:#fff;font-family:Orbitron,sans-serif;text-align:center;width:max-content;max-width:90vw}
#hud h1{margin:0;font-size:18px;letter-spacing:4px;color:#ff8fbf;text-shadow:0 0 12px #ff3d8b}
#hud p{margin:4px 0 0;font-size:11px;opacity:.75;font-family:system-ui,sans-serif}
#gbtn{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:14px;border:1px solid rgba(255,143,191,.6);background:rgba(255,61,139,.18);color:#fff;font-size:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#note{position:fixed;bottom:4px;width:100%;text-align:center;color:rgba(255,255,255,.5);font:10px system-ui,sans-serif}
#err{position:fixed;inset:auto 10px 80px;color:#ffb3c8;font:12px system-ui;text-align:center}
video{display:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="hud"><h1>CYBER HEART</h1><p id="status">拖动旋转 · 双指缩放 / Drag to rotate · pinch to zoom</p></div>
<button id="gbtn">开启手势 / Enable hand gestures</button>
<div id="note">摄像头画面仅在本设备处理，不会上传 / Camera frames stay on your device</div>
<div id="err"></div>
<video id="vid" playsinline muted></video>
<script type="module">
const errEl=document.getElementById('err'),statusEl=document.getElementById('status');
const showErr=m=>{errEl.textContent=m};
let THREE,OrbitControls,EffectComposer,RenderPass,UnrealBloomPass;
try{
  THREE=await import('three');
  ({OrbitControls}=await import('three/addons/controls/OrbitControls.js'));
  ({EffectComposer}=await import('three/addons/postprocessing/EffectComposer.js'));
  ({RenderPass}=await import('three/addons/postprocessing/RenderPass.js'));
  ({UnrealBloomPass}=await import('three/addons/postprocessing/UnrealBloomPass.js'));
}catch(e){showErr('加载失败，请检查网络 / Failed to load 3D libraries');throw e}

const mobile=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)||innerWidth<768;
const COUNT=mobile?32000:50000;
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'})}catch(e){showErr('此设备不支持 WebGL / WebGL is not available on this device');document.getElementById('gbtn').style.display='none';throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,0,mobile?62:48);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.enablePan=false;controls.minDistance=15;controls.maxDistance=140;
controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_ROTATE};

const pos=new Float32Array(COUNT*3),col=new Float32Array(COUNT*3),rnd=new Float32Array(COUNT);
const c1=new THREE.Color(0xff3d8b),c2=new THREE.Color(0xdfffff),tmp=new THREE.Color();
const S=1.45;
for(let i=0;i<COUNT;i++){
  const t=Math.random()*Math.PI*2,f=Math.pow(Math.random(),0.5);
  const x=16*Math.sin(t)**3,y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  pos[i*3]=x*f*S;pos[i*3+1]=y*f*S;pos[i*3+2]=(Math.random()*2-1)*4*S*f;
  tmp.copy(c1).lerp(c2,Math.random()*0.35*(1-f)+(Math.random()<0.06?0.8:0));
  col.set([tmp.r,tmp.g,tmp.b],i*3);rnd[i]=Math.random();
}
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setAttribute('color',new THREE.BufferAttribute(col,3));
geo.setAttribute('rnd',new THREE.BufferAttribute(rnd,1));
// spark1 sprite (generated radial texture)
const cv=document.createElement('canvas');cv.width=cv.height=64;const g=cv.getContext('2d');
const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.2,'rgba(255,255,255,.8)');gr.addColorStop(.5,'rgba(255,255,255,.15)');gr.addColorStop(1,'rgba(255,255,255,0)');
g.fillStyle=gr;g.fillRect(0,0,64,64);
let spark=new THREE.CanvasTexture(cv);
new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/spark1.png',t=>{mat.uniforms.map.value=t},undefined,()=>{});
const mat=new THREE.ShaderMaterial({
  uniforms:{time:{value:0},scale:{value:1},map:{value:spark},pr:{value:renderer.getPixelRatio()}},
  vertexShader:`attribute float rnd;varying vec3 vC;uniform float time,scale,pr;
  void main(){vC=color;float beat=pow(sin(time*3.4),3.0);
  vec3 p=position*(1.0+0.06*beat)*scale;
  p+=vec3(sin(time*.6+rnd*40.),cos(time*.5+rnd*31.),sin(time*.4+rnd*17.))*0.35;
  vec4 mv=modelViewMatrix*vec4(p,1.);gl_PointSize=(1.2+rnd*1.8)*pr*(60./-mv.z);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform sampler2D map;varying vec3 vC;void main(){vec4 t=texture2D(map,gl_PointCoord);gl_FragColor=vec4(vC,1.)*t;}`,
  vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(geo,mat));

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.7,0.4,0.82));

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});

// hand gestures (opt-in)
let target=1,cur=1,landmarker=null,video=document.getElementById('vid'),lastVT=-1;
const btn=document.getElementById('gbtn');
btn.onclick=async()=>{
  btn.disabled=true;btn.textContent='加载中… / Loading…';
  try{
    const v=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fs=await v.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    landmarker=await v.HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:2});
    video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480}});
    await video.play();btn.style.display='none';
    statusEl.textContent='双手拇指或单手捏合缩放 / Two thumbs or pinch to scale';
  }catch(e){console.warn('camera/gesture unavailable',e);btn.disabled=false;btn.textContent='开启手势 / Enable hand gestures';showErr('无法开启摄像头，继续使用触控 / Camera unavailable — touch still works');landmarker=null}
};
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function track(){
  if(!landmarker||video.readyState<2||video.currentTime===lastVT)return;lastVT=video.currentTime;
  try{const r=landmarker.detectForVideo(video,performance.now()),h=r.landmarks||[];
    let s=null;
    if(h.length>=2)s=d(h[0][4],h[1][4])*4;
    else if(h.length===1)s=d(h[0][4],h[0][8])*12;
    if(s!==null)target=Math.min(3.2,Math.max(0.4,s));
  }catch(e){}
}
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{track();cur+=(target-cur)*0.12;mat.uniforms.scale.value=cur;mat.uniforms.time.value=clock.getElapsedTime();controls.update();composer.render()});
</script></body></html>
